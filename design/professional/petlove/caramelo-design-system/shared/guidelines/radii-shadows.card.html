<!-- @dsCard group="Spacing" viewport="700x180" name="Radii & shadows" subtitle="Corner radii 4–24 + pill, and the warm-brown elevation shadows" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:24px;background:var(--c-bg);font-family:var(--font-plain)}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .r{width:64px;height:48px;background:var(--c-brand-faint);border:2px solid var(--c-brand)}
  .s{width:80px;height:48px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:16px}
  .n{font-size:11px;color:var(--c-text-muted);font-weight:600}
  .grp{font:600 11px var(--font-plain);letter-spacing:.5px;text-transform:uppercase;color:var(--c-text-muted);margin:0 0 12px}
</style></head>
<body>
<p class="grp">Radii</p>
<div class="row" style="margin-bottom:20px">
  <div class="item"><div class="r" style="border-radius:4px"></div><div class="n">xxs 4</div></div>
  <div class="item"><div class="r" style="border-radius:8px"></div><div class="n">xs 8</div></div>
  <div class="item"><div class="r" style="border-radius:12px"></div><div class="n">sm 12</div></div>
  <div class="item"><div class="r" style="border-radius:16px"></div><div class="n">md 16</div></div>
  <div class="item"><div class="r" style="border-radius:20px"></div><div class="n">lg 20</div></div>
  <div class="item"><div class="r" style="border-radius:999px"></div><div class="n">pill</div></div>
</div>
<p class="grp">Shadows</p>
<div class="row">
  <div class="item"><div class="s" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
  <div class="item"><div class="s" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
  <div class="item"><div class="s" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
  <div class="item"><div class="s" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
</div>
</body></html>
