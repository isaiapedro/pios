<!-- @dsCard group="Colors" viewport="700x180" name="Feedback colors" subtitle="Success, warning, danger, info — main + soft" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--c-bg);font-family:var(--font-plain)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .col{flex:1;min-width:120px}
  .pair{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--c-border)}
  .main{flex:2;height:56px}
  .soft{flex:1;height:56px}
  .name{font-size:12px;font-weight:700;color:var(--c-text);margin:7px 2px 0}
  .val{font-size:11px;color:var(--c-text-muted);margin:1px 2px 0}
  .grp{font:600 11px var(--font-plain);letter-spacing:.5px;text-transform:uppercase;color:var(--c-text-muted);margin:0 0 10px}
</style></head>
<body>
<p class="grp">Semantic feedback</p>
<div class="row">
  <div class="col"><div class="pair"><div class="main" style="background:var(--c-success)"></div><div class="soft" style="background:var(--c-success-soft)"></div></div><div class="name">Success</div><div class="val">#49A971</div></div>
  <div class="col"><div class="pair"><div class="main" style="background:var(--c-warning)"></div><div class="soft" style="background:var(--c-warning-soft)"></div></div><div class="name">Warning</div><div class="val">#FFA840</div></div>
  <div class="col"><div class="pair"><div class="main" style="background:var(--c-danger)"></div><div class="soft" style="background:var(--c-danger-soft)"></div></div><div class="name">Danger</div><div class="val">#EA534A</div></div>
  <div class="col"><div class="pair"><div class="main" style="background:var(--c-info)"></div><div class="soft" style="background:var(--c-info-soft)"></div></div><div class="name">Info</div><div class="val">#0A60D8</div></div>
</div>
</body></html>
