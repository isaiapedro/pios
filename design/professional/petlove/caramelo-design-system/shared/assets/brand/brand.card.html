<!-- @dsCard group="Brand" viewport="700x300" name="Logos & marks" subtitle="Petlove wordmark, Caramelo logo and the heart mark" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--c-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tile { display: flex; align-items: center; justify-content: center; gap: 12px; height: 110px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 16px; }
  .tile.dark { background: var(--c-brand); }
  .cap { grid-column: 1 / -1; font: 600 11px var(--font-plain); letter-spacing:.5px; text-transform: uppercase; color: var(--c-text-muted); margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.CarameloDesignSystemPetlove_6f57df;
const { PetloveLogo, CarameloLogo, HeartSolid, Heart } = NS;
function Demo() {
  return (
    <div className="grid">
      <div className="tile"><PetloveLogo size="lg" type="default" style={{transform:"scale(2.2)"}} /></div>
      <div className="tile dark"><PetloveLogo size="lg" type="inverse" style={{transform:"scale(2.2)"}} /></div>
      <div className="cap">Caramelo logo · Heart mark</div>
      <div className="tile"><CarameloLogo style={{transform:"scale(1.6)"}} /></div>
      <div className="tile" style={{gap:24}}>
        <HeartSolid style={{color:"var(--c-heart)", transform:"scale(1.8)"}} />
        <Heart style={{color:"var(--c-brand)", transform:"scale(1.8)"}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
