<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Petlove Storefront Hero" description="Branded pt-BR storefront hero — logo, search, categories and a product grid built from Caramelo components." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  body { margin: 0; background: #F9F4EC; font-family: "Inter", system-ui, sans-serif; }
</style>
</helmet>
<div style="max-width:1080px;margin:0 auto;padding:28px 24px 56px;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;">
    <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.PetloveLogo" size="lg" type="default" hint-size="120px,28px" style="transform:scale(1.6);transform-origin:left center;"></x-import>
    <div style="display:flex;gap:8px;">
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.IconButton" name="heart" type="neutral" weight="ghost" ariaLabel="Favoritos" hint-size="48px,48px"></x-import>
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.IconButton" name="cart" type="default" weight="primary" ariaLabel="Sacola" hint-size="48px,48px"></x-import>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center;padding:24px 0 32px;">
    <h1 style="font-family:'Gooper',Georgia,serif;font-weight:800;font-size:48px;line-height:1.08;color:#322D25;margin:0;max-width:680px;">Tudo para quem você ama de quatro patas</h1>
    <p style="font-size:18px;color:#675D4C;margin:0;max-width:560px;line-height:1.5;">Ração, brinquedos, higiene e farmácia com entrega rápida e o cuidado do Clube Petlove.</p>
    <div style="width:100%;max-width:560px;margin-top:8px;">
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.SearchBar" size="lg" placeholder="Buscar ração, brinquedos e mais" hint-size="100%,56px"></x-import>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.Chip" icon="dog" selected="{{ true }}" hint-size="90px,36px">Cães</x-import>
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.Chip" icon="cat" hint-size="90px,36px">Gatos</x-import>
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.Chip" icon="gift" hint-size="110px,36px">Brinquedos</x-import>
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.Chip" icon="plus" hint-size="110px,36px">Farmácia</x-import>
    </div>
  </div>

  <h2 style="font-family:'Gooper',Georgia,serif;font-weight:700;font-size:24px;color:#322D25;margin:0 0 16px;">Ofertas pra vocês</h2>
  <sc-for list="{{ products }}" as="p" hint-placeholder-count="3">
    <div style="display:inline-block;vertical-align:top;margin:0 14px 14px 0;">
      <x-import component-from-global-scope="CarameloDesignSystemPetlove_6f57df.ProductCard"
        image="{{ p.image }}" brand="{{ p.brand }}" title="{{ p.title }}"
        price="{{ p.price }}" originalPrice="{{ p.original }}" discount="{{ p.discount }}"
        rating="{{ p.rating }}" reviews="{{ p.reviews }}" club="{{ p.club }}"
        hint-size="240px,400px"></x-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      products: [
        { id: 1, brand: "Golden", title: "Ração Golden Special Adultos Frango 15kg", price: 189.9, original: 229.9, discount: 17, rating: 4.5, reviews: 312, club: true,
          image: "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=480&q=80" },
        { id: 2, brand: "Whiskas", title: "Ração Whiskas Carne para Gatos Adultos 10kg", price: 124.9, original: 149.9, discount: 16, rating: 4.7, reviews: 540, club: false,
          image: "https://images.unsplash.com/photo-1568640347023-a616a30bc3bd?w=480&q=80" },
        { id: 3, brand: "Petlove", title: "Brinquedo Mordedor Osso de Borracha", price: 39.9, original: 59.9, discount: 33, rating: 4.3, reviews: 98, club: true,
          image: "https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?w=480&q=80" },
        { id: 4, brand: "Pedigree", title: "Petisco Pedigree Dentastix para Cães", price: 18.5, original: 24.9, discount: 26, rating: 4.8, reviews: 720, club: true,
          image: "https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=480&q=80" },
      ],
    };
  }
}
</script>
</body>
</html>
