<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />

  .tag{font:500 11px var(--font-plain);color:var(--c-text-muted);margin-left:8px}
  code{font-family:var(--font-mono);background:var(--c-surface-cream);padding:2px 6px;border-radius:6px;font-size:13px}
</style></head>
<body>
<p class="line" style="font-size:16px;font-weight:600">Subtítulo médio — 16 / Semibold<span class="tag">subtitle-md</span></p>

<p class="line" style="font-size:14px;font-weight:500;color:var(--c-brand)">Label de ação — 14 / Medium<span class="tag">action-label</span></p>
<p class="line" style="font-size:12px;color:var(--c-text-muted)">Legenda e textos auxiliares — 12 / Regular<span class="tag">caption</span></p>
<p class="line"><code>R$ 189,90</code> &nbsp; <code>--c-brand</code><span class="tag">Roboto Mono</span></p>
