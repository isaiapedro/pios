<!-- @dsCard group="Colors" viewport="700x200" name="Caramelo neutrals" subtitle="The warm sand/cream grey scale — the system's signature" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--c-bg);font-family:var(--font-plain)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .sw{flex:1;min-width:74px;border-radius:12px;overflow:hidden;border:1px solid var(--c-border)}
  .chip{height:58px}
  .meta{padding:7px 8px}
  .name{font-size:11px;font-weight:700;color:var(--c-text)}
  .val{font-size:10px;color:var(--c-text-muted)}
  .grp{font:600 11px var(--font-plain);letter-spacing:.5px;text-transform:uppercase;color:var(--c-text-muted);margin:0 0 10px}
</style></head>
<body>
<p class="grp">Warm neutrals — cream → ink</p>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--grey-100)"></div><div class="meta"><div class="name">100</div><div class="val">#F9F4EC</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-200)"></div><div class="meta"><div class="name">200</div><div class="val">#EBE2D3</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-300)"></div><div class="meta"><div class="name">300</div><div class="val">#D3C8B6</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-500)"></div><div class="meta"><div class="name">500</div><div class="val">#93846C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-700)"></div><div class="meta"><div class="name">700</div><div class="val">#675D4C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-800)"></div><div class="meta"><div class="name">800</div><div class="val">#4F473B</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-900)"></div><div class="meta"><div class="name">900</div><div class="val">#322D25</div></div></div>
</div>
</body></html>
