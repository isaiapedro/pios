<!-- @dsCard group="Colors" viewport="700x180" name="Brand & accent" subtitle="Purple brand scale + the Caramelo heart red" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--c-bg);font-family:var(--font-plain)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{flex:1;min-width:90px;border-radius:12px;overflow:hidden;border:1px solid var(--c-border)}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-size:12px;font-weight:700;color:var(--c-text)}
  .val{font-size:11px;color:var(--c-text-muted)}
  .grp{font:600 11px var(--font-plain);letter-spacing:.5px;text-transform:uppercase;color:var(--c-text-muted);margin:0 0 10px}
</style></head>
<body>
<p class="grp">Brand purple · Heart accent</p>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--purple-100)"></div><div class="meta"><div class="name">faint</div><div class="val">#F5F1FD</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-200)"></div><div class="meta"><div class="name">soft</div><div class="val">#E4DBF3</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-brand)"></div><div class="meta"><div class="name">brand 600</div><div class="val">#4E2096</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-brand-strong)"></div><div class="meta"><div class="name">strong 700</div><div class="val">#3A1574</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-brand-darkest)"></div><div class="meta"><div class="name">darkest</div><div class="val">#2F135A</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-heart)"></div><div class="meta"><div class="name">heart</div><div class="val">#EA534A</div></div></div>
</div>
</body></html>
