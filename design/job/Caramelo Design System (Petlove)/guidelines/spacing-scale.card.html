<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid — 4 / 8 / 12 / 16 / 24 / 32 / 48" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:24px;background:var(--c-bg);font-family:var(--font-plain)}
  .row{display:flex;align-items:flex-end;gap:18px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--c-brand);border-radius:4px;width:100%}
  .box{display:flex;align-items:flex-end;height:64px}
  .n{font-size:11px;color:var(--c-text-muted);font-weight:600}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box"><div class="bar" style="width:4px;height:4px"></div></div><div class="n">1 · 4</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:8px;height:8px"></div></div><div class="n">2 · 8</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:12px;height:12px"></div></div><div class="n">3 · 12</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:16px;height:16px"></div></div><div class="n">4 · 16</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:24px;height:24px"></div></div><div class="n">6 · 24</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:32px;height:32px"></div></div><div class="n">8 · 32</div></div>
  <div class="item"><div class="box"><div class="bar" style="width:48px;height:48px"></div></div><div class="n">12 · 48</div></div>
</div>
</body></html>
