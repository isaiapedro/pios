<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 24px; background: var(--c-surface); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .inline { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, SegmentedButton, Chip, Pagination, Stepper, BottomNav } = window.CarameloDesignSystemPetlove_6f57df;
function Demo() {
  return (
    <div className="stack">
      <Tabs tabs={["Ração","Brinquedos","Higiene","Farmácia"]} />
      <div className="inline">
        <SegmentedButton options={["Cães","Gatos"]} defaultValue="Cães" />

        <Chip>Filhotes</Chip>

      <Stepper steps={["Sacola","Entrega","Pagamento"]} current={1} />

        <Pagination page={3} total={12} />
      </div>
      <div style={{maxWidth:390, border:"1px solid var(--c-border)", borderRadius:20, overflow:"hidden"}}>
        <BottomNav defaultValue="home" items={[
          {value:"home",label:"Início",icon:"home"},
          {value:"search",label:"Buscar",icon:"search"},
          {value:"cart",label:"Sacola",icon:"cart"},
          {value:"pet",label:"Meu pet",icon:"dog"},
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
