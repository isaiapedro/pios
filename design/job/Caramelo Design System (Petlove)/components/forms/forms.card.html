<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--c-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .inline { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, Counter, SearchBar } = window.CarameloDesignSystemPetlove_6f57df;
function Demo() {
  return (
    <div className="stack">
      <SearchBar />
      <div className="grid">
        <Input label="E-mail" placeholder="voce@email.com" helper="Usamos para o login" />
        <Select label="Espécie" placeholder="Selecione" options={["Cão","Gato","Pássaro"]} />
        <Input label="CEP" error="CEP inválido" defaultValue="0000" />
        <div className="stack">
          <div className="inline">
            <Checkbox label="Ofertas" defaultChecked />
            <Switch label="Recorrente" defaultChecked />
          </div>
          <div className="inline">
            <Radio name="p" label="Mensal" defaultChecked />
            <Radio name="p" label="Anual" />
            <Counter defaultValue={2} min={1} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
