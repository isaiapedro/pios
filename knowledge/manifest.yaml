version: "1.0"
domain: "knowledge"
name: "Central Knowledge Hub"
description: "Root configuration, ontology mapping, and taxonomy governance for all objective subject domains."

subdomains:
  - id: "health"
    path: "knowledge/health"
    description: "Medical informatics, health data standards, clinical workflows, and life sciences."
  - id: "business"
    path: "knowledge/business"
    description: "Corporate strategy, regulatory compliance, quality management systems (QMS), and market operations."
  - id: "technology"
    path: "knowledge/technology"
    description: "Software engineering, system architectures, data engineering, and infrastructure."
  - id: "media"
    path: "knowledge/media"
    description: "Content strategy, editorial workflows, publishing pipelines, and media assets."
  - id: "arts"
    path: "knowledge/arts"
    description: "Visual design, creative writing, aesthetics, sound, and interactive arts."

migration_plan:
  status: "pending"
  rules:
    - action: "move_and_reindex"
      source: "knowledge/wiki_tcc/raw/HL7 FHIR R4"
      target: "knowledge/health/raw/HL7 FHIR R4"
    - action: "move_and_reindex"
      source: "knowledge/wiki_tcc/raw/OMOP CDM v5.4"
      target: "knowledge/health/raw/OMOP CDM v5.4"
    - action: "move_and_reindex"
      source: "knowledge/wiki_tcc/raw/ISO 13485, IEC 62304, and EU MDR compliance"
      target: "knowledge/business/raw/ISO 13485, IEC 62304, and EU MDR compliance"
    - action: "move_and_reindex"
      source: "knowledge/health/raw/HL7 FHIR R4"
      target: "knowledge/health/raw/HL7 FHIR R4"
    - action: "move_and_reindex"
      source: "knowledge/health/raw/OMOP CDM v5.4"
      target: "knowledge/health/raw/OMOP CDM v5.4"
    - action: "move_and_reindex"
      source: "knowledge/business/raw/ISO 13485, IEC 62304, and EU MDR compliance"
      target: "knowledge/business/raw/ISO 13485, IEC 62304, and EU MDR compliance"
    - action: "move_and_reindex"
      source: "knowledge/blog_manager"
      target: "knowledge/media/blog_manager"
    - action: "cleanup"
      targets:
        - "knowledge/wiki_tcc"
        - "knowledge/blog_manager"
      condition: "empty_or_migrated"
