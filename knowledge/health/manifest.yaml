version: "1.0"
domain: "health"
name: "Health & Life Sciences Domain"
description: "Medical informatics, health data standards, observational data models, and clinical systems."

paths:
  raw: "knowledge/health/raw"
  synthesized: "knowledge/health/synthesized"

sources:
  - id: "hl7-fhir-r4"
    name: "HL7 FHIR R4"
    type: "interoperability_standard"
    path: "knowledge/health/raw/HL7 FHIR R4"
  - id: "omop-cdm-v54"
    name: "OMOP CDM v5.4"
    type: "observational_data_model"
    path: "knowledge/health/raw/OMOP CDM v5.4"
  - id: "loinc-user-guide"
    name: "LOINC User Guide"
    type: "terminology_standard"
    path: "knowledge/health/raw/LOINC User Guide"
  - id: "fhir-schemas"
    name: "FHIR JSON Schemas"
    type: "schema_definitions"
    path: "knowledge/health/raw/FHIR-schemas"
  - id: "tcc-research-corpus"
    name: "TCC Healthcare Analytics Research Corpus"
    type: "research_papers"
    path: "knowledge/health/raw"
    note: "~200 papers on healthcare big data, streaming analytics, vital signs, EHR, IoT health"
  - id: "behavioral-science-corpus"
    name: "Behavioral & Cognitive Science Papers"
    type: "research_papers"
    path: "knowledge/health/raw"
    note: "Papers on habit formation, cognitive load, deliberate practice, sleep, goal systems"
  - id: "tcc-synthesized"
    name: "TCC Research Synthesis Documents"
    type: "synthesized_research"
    path: "knowledge/health/synthesized/tcc"

cross_domain_dependencies:
  business:
    - "ISO 13485, IEC 62304, and EU MDR compliance"
  technology:
    - "REST API Architecture"
    - "Relational Data Modeling"
